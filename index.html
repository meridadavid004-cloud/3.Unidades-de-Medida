<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unidades de Medida</title>
    <style>
        h1 {font-size: 3em;}
        #caja {width: 100vw;
        height: 100vh;
        background-color: brown;}
        #titulo {background-color: cornflowerblue;
        width: 50%;}
    </style>
</head>
<body>
    <div id="caja">
        <div id="titulo">
            Esto es una Subcaja
        </div>
        <h1>Unidades de Medida en CSS</h1>
        <p>A diferencia de HTML, en CSS se puede 
            indicar el tamaño de los elementos
            con distintas unidades. Por Ejemplo:
            centimetros, pulgadas, pixeles...
        </p>
    </div>
</body>
</html>
